[project]
name = "supfeel-backend"
version = "0.1.0"
description = "Supfeel backend: FastAPI + LangGraph resolution agent"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.19",
    "mcp>=2.3,<3",
    "openai>=3.42.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.10",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "sse-starlette>=3.6.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
